name: Switchboard integration build
on:
  push:
    branches: [switchboard/minimal-engine]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace
      - run: ./gradlew :app:testDebugUnitTest --tests '*ManifestPatcherTest.renamesThePackage' --tests '*ManifestPatcherTest.removingNothingKeepsEveryPermission' --tests '*ResourceTableRenamerTest'
      - uses: actions/upload-artifact@v4
        with:
          name: switchboard-apk-toolbox-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
