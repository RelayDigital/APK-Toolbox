name: Switchboard integration build
on:
  push:
    branches: [switchboard/minimal-engine]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: switchboard-apk-toolbox-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
