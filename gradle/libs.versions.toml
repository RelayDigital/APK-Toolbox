[versions]
agp = "9.3.0"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.14.0"
activity = "1.8.0"
recyclerview = "1.4.0"
lifecycle = "2.7.0"
coroutines = "1.7.3"
apksig = "9.3.0"
work = "2.12.0"
shizuku = "13.1.5"
arsclib = "1.4.0"
jsoup = "1.21.2"
junit = "4.13.2"
orgJson = "20250517"
jbcrypt = "0.4"
commonsCompress = "1.27.1"
xz = "1.10"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
